# Kart gönderici: olay kartları (D1 `kart` kuyruğu → çiz → Worker → Telegram) ve dönemsel kartlar.
#
# GEREKEN SIRLAR (Settings → Secrets and variables → Actions; burada OLUŞTURULMAZ):
#   TERTREMO_KART_ANAHTARI  Worker kart adresi için ortak anahtar (Telegram gönderimini Worker yapar;
#                           bot token'ı, kanal ve sahip kimliği GitHub'da YOK)
#   CF_D1_TOKEN         D1 okuma/yazma token'ı
#   CF_HESAP            Cloudflare hesap kimliği
#   D1_ID               D1 veritabanı kimliği
#
# Tetikleyiciler (hepsi workflow_dispatch; GitHub `schedule` saatlerce gecikebildiği için KULLANILMAZ):
#   olay        Worker kuyruğa yazınca tetikler (mod = `olay`)
#   dönemsel    Cloudflare'deki vesaire cron'u (vesaire/tertremo/src/takvim.js) aşağıdaki TSİ saatlerinde
#               `donemsel <tur>` ile tetikler; en çok 30 dk gecikmeli yakalama, günde bir kez. Elle deneme de aynı mod.
#
# Dönemsel takvim (tasarım §17.1/§17.4), saatler TSİ (takvim.js'teki SLOTLAR ile aynı olmalı):
#   gunluk        her gün 21:00          haftalik  Pzt 08:00          dunya-haftasi  Paz 20:00
#   aylik-gr      ayın 1'i 10:00         aylik-b   ayın 1'i 10:30
#   ceyreklik λ   Oca/Nis/Tem/Eki 1'i 11:00     uzun-donem  ayın 1'i 12:00
#   etas          Pzt 10:00 (yayin=true değilse yalnız sahibe gider)
name: kart

on:
  workflow_dispatch:
    inputs:
      mod:
        description: 'olay  |  donemsel etas  |  donemsel aylikGr  |  donemsel aylikB  |  donemsel ceyreklikLambda  |  donemsel uzunDonem  |  donemsel gunluk  |  donemsel haftalik  |  donemsel dunyaHafta'
        required: true
        default: 'olay'

permissions:
  contents: read

concurrency:
  # Dönemsel koşular kendi grubunda: olay tetiği onları iptal edemez/kuyruğunu bozamaz.
  group: ${{ startsWith(github.event.inputs.mod, 'donemsel') && 'kart-donemsel' || 'kart' }}
  cancel-in-progress: false

jobs:
  kart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Modu belirle
        id: mod
        env:
          GIRDI: ${{ github.event.inputs.mod }}
        run: |
          MOD="$GIRDI"
          case "$MOD" in
            olay|'donemsel etas'|'donemsel aylikGr'|'donemsel aylikB'|'donemsel ceyreklikLambda'|'donemsel uzunDonem'|'donemsel gunluk'|'donemsel haftalik'|'donemsel dunyaHafta') ;;
            *) echo "geçersiz mod: $MOD" >&2; exit 1 ;;
          esac
          echo "mod=$MOD" >> "$GITHUB_OUTPUT"
          echo "BASLA=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Katalog/hesap önbelleği yalnız dönemsel mod için (kart-veri.json); olay modunda geri yüklenmez.
      - name: Katalog önbelleği
        if: startsWith(steps.mod.outputs.mod, 'donemsel')
        uses: actions/cache/restore@v4
        with:
          path: hesap/.onbellek
          key: katalog-v2-${{ github.run_id }}
          restore-keys: |
            katalog-v2-
            katalog-v1-

      - name: Kartları çiz ve gönder
        env:
          MOD: ${{ steps.mod.outputs.mod }}
          # Sırlar yalnız bu adımda (checkout / npm ci kurulum betikleri sırları görmesin; repo herkese açık).
          TERTREMO_KART_ANAHTARI: ${{ secrets.TERTREMO_KART_ANAHTARI }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_HESAP: ${{ secrets.CF_HESAP }}
          D1_ID: ${{ secrets.D1_ID }}
        run: node scripts/kart/calistir.mjs $MOD

      # Gerçek koşucudaki süreyi ölçmek için (bütçe: olay başına ~1 dk, dönemsel ~2 dk).
      - name: Süre
        if: always()
        run: |
          SURE=$(( $(date +%s) - BASLA ))
          echo "iş süresi (kurulum dahil): ${SURE} sn"
          echo "kart (${{ steps.mod.outputs.mod }}): ${SURE} sn" >> "$GITHUB_STEP_SUMMARY"
