# Gece hesabı: katalog (Actions cache) → kume, kume_param, hucre → D1 (hesap/gunluk.py)
# Pazartesi ayrıca ETAS doğrulaması + haftalık ETAS (hesap/dogrulama.py, hesap/etas.py) → kart-veri.json;
# kart.yml `donemsel etas` 10:00'da bunu okur.
name: gunluk

# Tetik: Cloudflare'deki vesaire cron'u her gün 06:00 TSİ'de workflow_dispatch ile (vesaire/tertremo/src/takvim.js);
# GitHub `schedule` gecikmeli olduğu için kullanılmaz.
on:
  workflow_dispatch:
    inputs:
      etas:
        description: 'otomatik: yalnız pazartesi (TSİ)  |  deneme: bugün çalışır, D1 sınav kaydı ve kart verisi yazılmaz'
        type: choice
        default: otomatik
        options: [otomatik, deneme]

permissions:
  contents: read

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  hesap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            hesap/requirements.txt
            hesap/requirements-etas.txt

      - run: pip install -r hesap/requirements.txt

      # v2: katalogda `yer` sütunu. v2 yoksa v1 önbelleği geri yüklenir (hesap/katalog.yukle yer'siz satırı okur,
      # yeniden indirme gerekmez); kayıt her zaman v2 anahtarıyla.
      - name: Katalog önbelleği
        uses: actions/cache/restore@v4
        with:
          path: hesap/.onbellek
          key: katalog-v2-${{ github.run_id }}
          restore-keys: |
            katalog-v2-
            katalog-v1-

      # ETAS denemesinde gece hesabı kuru: D1'e yazmaz (26 Ekim'de deneme 39k satır yazdı, D1 günlük kotası aşıldı)
      - name: Günlük hesap
        timeout-minutes: 15
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_HESAP: ${{ secrets.CF_HESAP }}
          D1_ID: ${{ secrets.D1_ID }}
        run: python -m hesap.gunluk ${{ inputs.etas == 'deneme' && '--kuru' || '' }}

      - name: ETAS günü mü
        id: etas
        run: |
          if [ "${{ inputs.etas }}" = deneme ]; then echo "mod=deneme" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Istanbul date +%u)" = 1 ]; then echo "mod=pazartesi" >> "$GITHUB_OUTPUT"
          else echo "mod=yok" >> "$GITHUB_OUTPUT"; fi

      - name: ETAS bağımlılıkları
        if: steps.etas.outputs.mod != 'yok'
        run: pip install -r hesap/requirements-etas.txt

      # ETAS hatası gece hesabını ve önbellek kaydını düşürmesin; kart.yml etas bloğu yoksa kendisi hata verir.
      # Denemede D1 sırları verilmez (etas_kayit'e yazılmaz) ve kart verisi geçici dosyaya gider.
      - name: ETAS doğrulama + haftalık olasılık
        if: steps.etas.outputs.mod != 'yok'
        continue-on-error: true
        timeout-minutes: 35
        env:
          CF_D1_TOKEN: ${{ steps.etas.outputs.mod == 'pazartesi' && secrets.CF_D1_TOKEN || '' }}
          CF_HESAP: ${{ steps.etas.outputs.mod == 'pazartesi' && secrets.CF_HESAP || '' }}
          D1_ID: ${{ steps.etas.outputs.mod == 'pazartesi' && secrets.D1_ID || '' }}
        run: |
          if [ "${{ steps.etas.outputs.mod }}" = deneme ]; then
            KV="$RUNNER_TEMP/kart-veri-deneme.json"
            cp hesap/.onbellek/kart-veri.json "$KV" 2>/dev/null || true
            set -- --kart-veri "$KV"
          fi
          python -m hesap.dogrulama "$@"
          python -m hesap.etas "$@"

      # Hata ya da zaman aşımında da kaydet: indirilen katalog ve D1'e yazılanların durumu kaybolmasın
      - name: Katalog önbelleğini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hesap/.onbellek
          key: katalog-v2-${{ github.run_id }}
