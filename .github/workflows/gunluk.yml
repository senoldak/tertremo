# Gece hesabı: katalog (Actions cache) → kume, kume_param, hucre → D1 (hesap/gunluk.py)
name: gunluk

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  hesap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hesap/requirements.txt

      - run: pip install -r hesap/requirements.txt

      # v2: katalogda `yer` sütunu. v2 yoksa v1 önbelleği geri yüklenir (hesap/katalog.yukle yer'siz satırı okur,
      # yeniden indirme gerekmez); kayıt her zaman v2 anahtarıyla.
      - name: Katalog önbelleği
        uses: actions/cache/restore@v4
        with:
          path: hesap/.onbellek
          key: katalog-v2-${{ github.run_id }}
          restore-keys: |
            katalog-v2-
            katalog-v1-

      - name: Günlük hesap
        env:
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
          CF_HESAP: ${{ secrets.CF_HESAP }}
          D1_ID: ${{ secrets.D1_ID }}
        run: python -m hesap.gunluk

      # Hata ya da zaman aşımında da kaydet: indirilen katalog ve D1'e yazılanların durumu kaybolmasın
      - name: Katalog önbelleğini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hesap/.onbellek
          key: katalog-v2-${{ github.run_id }}
